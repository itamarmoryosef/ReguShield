<div dir="rtl" style="margin:0;padding:24px;background-color:#f9fafb;font-family:Arial,Helvetica,sans-serif">
  <div style="max-width:520px;margin:0 auto;background-color:#ffffff;border:1px solid #e5e7eb;border-radius:16px;padding:32px">
    <div style="font-size:15px;font-weight:bold;color:#111827;padding-bottom:20px;border-bottom:1px solid #f3f4f6">
      ReguShield
    </div>

    <h1 style="margin:24px 0 0;font-size:20px;font-weight:bold;color:#111827">אימות כתובת הדוא״ל</h1>

    <p style="margin:12px 0 0;font-size:15px;line-height:1.7;color:#374151">
      תודה שנרשמתם. נשאר צעד אחד: אימות הכתובת, ואפשר להתחיל לנהל את הרישוי של העסק.
    </p>

    <div style="margin:28px 0">
      <a
        href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&amp;type=signup"
        style="display:inline-block;background-color:#4f46e5;color:#ffffff;font-size:15px;font-weight:bold;text-decoration:none;padding:13px 28px;border-radius:10px"
      >
        אימות החשבון
      </a>
    </div>

    <p style="margin:0;font-size:13px;line-height:1.7;color:#6b7280">
      הקישור תקף לשעה אחת ולשימוש אחד בלבד.
    </p>

    <p style="margin:16px 0 0;font-size:13px;line-height:1.7;color:#6b7280">
      אם לא נרשמתם ל-ReguShield, אפשר להתעלם מההודעה הזו.
    </p>

    <p style="margin:24px 0 0;padding-top:20px;border-top:1px solid #f3f4f6;font-size:12px;color:#9ca3af">
      נשלח אליכם מ-ReguShield, ניהול רגולציה ורישוי עסקים.
    </p>
  </div>
</div>
